[project]
name = "negociacion"
version = "0.1.0"
description = "Servicio de negociación de precios para licitaciones hospitalarias (droguería)"
requires-python = ">=3.12"

# El paquete `normalizador` NO depende de nada de esta lista: es una librería
# pura (stdlib solamente). Eso es a propósito — es la pieza que más se testea
# y la que no puede quedar atada a un framework.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0.7",
  "openai>=1.55",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "normalizador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
